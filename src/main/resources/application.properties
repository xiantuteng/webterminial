# 浏览器入口：http://<host>:18080/wt/
# 欢迎页默认只显示 nginx 欢迎内容。按 Ctrl+Alt+Shift+L 切换登录窗口。
# 登录账号是运行本服务这台机器上的系统账号。

server.port=18080
server.server-header=nginx
server.servlet.context-path=/wt
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.session.timeout=12h
server.servlet.session.cookie.name=WTSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/wt
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

spring.application.name=webterminal
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.jackson.default-property-inclusion=non_null

logging.level.root=INFO
logging.level.com.jingzhou.webterminal=INFO
